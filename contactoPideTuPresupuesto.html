    <h1 class="tituloPagina">Pide tu presupuesto</h1>

  <!-- Formulario -->
  <form class="container mt-4" action="https://formsubmit.co/limpiezasfani@gmail.com" method="POST">
  <!-- Oculta captcha y redirección tras enviar -->
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://tusitio.com/gracias.html">

  <div class="mb-3">
    <input type="text" class="form-control" name="nombre" placeholder="Nombre completo" required>
  </div>
  <div class="mb-3">
    <input type="email" class="form-control" name="email" placeholder="Correo electrónico" required>
  </div>
  <div class="mb-3">
    <input type="tel" class="form-control" name="telefono" placeholder="Teléfono" required>
  </div>
  <div class="mb-3">
    <textarea class="form-control" name="mensaje" placeholder="¿Qué tipo de servicio necesitas?" required></textarea>
  </div>

  <p class="fw-bold fs-5">¿Cómo prefiere que contactemos con usted?</p>

  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="contacto_telefono" id="checkTelefono">
    <label class="form-check-label fs-5" for="checkTelefono">Teléfono</label>
  </div>

  <div class="mb-3">
    <select class="form-select" name="prefijo_telefono">
      <option selected value="+34">🇪🇸 +34</option>
      <option value="+33">🇫🇷 +33</option>
      <option value="+44">🇬🇧 +44</option>
      <option value="+49">🇩🇪 +49</option>
      <option value="+1">🇺🇸 +1</option>
      <option value="+52">🇲🇽 +52</option>
      <option value="+39">🇮🇹 +39</option>
      <option value="+351">🇵🇹 +351</option>
    </select>
    <input type="tel" class="form-control mt-2" name="telefono_extra" placeholder="Número de teléfono adicional" pattern="[0-9]{6,15}">
  </div>

  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="contacto_email" id="checkEmail">
    <label class="form-check-label fs-5" for="checkEmail">Correo electrónico</label>
  </div>

  <div class="mb-3">
    <input type="email" class="form-control" name="email_extra" placeholder="Correo electrónico adicional">
  </div>

  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="aceptoDatos" name="acepto_datos" required>
    <label class="form-check-label fs-5" for="aceptoDatos">Acepto el tratamiento de mis datos.</label>
  </div>

  <button type="submit" class="btn btn-primary">Enviar</button>
</form>
